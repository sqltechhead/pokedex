[project]
name = "pokedex"
version = "0.1.0"
description = "Offline Pokédex: mirrors PokéAPI into a local SQLite database and sprite folders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pygame-ce>=2.5.8",
    "requests>=2.34.2",
]

[project.scripts]
pokedex = "pokedex.ui.app:main"
pokedex-fetch = "pokedex.fetcher.cli:main"
pokedex-narrate = "pokedex.narrator.cli:main"
pokedex-embed = "pokedex.recognizer.cli:main"

[project.optional-dependencies]
narrate = [
    "numpy>=2.4.6",
    "onnxruntime<1.20 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "piper-tts>=1.8.0",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
]
recognize = [
    "numpy>=2.4.6",
    "onnxruntime>=1.19.2",
    "onnxruntime<1.20 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "pillow>=13.0.0",
    "tokenizers>=0.23.3",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.6.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
exclude = ["*.md"]
